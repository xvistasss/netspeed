<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" fill="none">
  <defs>
    <!-- Luminous radial gradient with exact color tint and radial alpha transparency -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#91ef70" stop-opacity="1"/>
      <stop offset="22%" stop-color="#93f36a" stop-opacity="0.92"/>
      <stop offset="44%" stop-color="#95f564" stop-opacity="0.84"/>
      <stop offset="60%" stop-color="#97f65a" stop-opacity="0.77"/>
      <stop offset="75%" stop-color="#9af84f" stop-opacity="0.70"/>
      <stop offset="85%" stop-color="#9bfa45" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#9dfc3e" stop-opacity="0.61"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="900" height="900" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Background with Radial Gradient and Soft Shadow -->
  <rect x="68" y="68" width="764" height="764" rx="172" ry="172" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Outer Speedometer Dial Arc with Calibrated Asymmetric Opening -->
  <path d="M 352 265 A 200 200 0 1 0 548 268" stroke="#ffffff" stroke-width="54" stroke-linecap="round" fill="none"/>

  <!-- Speedometer Needle (tilted clockwise ~3.5°) and Center Hub Base -->
  <line x1="450" y1="452" x2="460" y2="256" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
  <circle cx="450" cy="452" r="67.5" fill="#ffffff"/>

  <!-- Center Pin Dot (blends with radial center core) -->
  <circle cx="450" cy="452" r="13" fill="#91ef70"/>
</svg>